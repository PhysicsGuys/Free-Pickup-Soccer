<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Pickup Soccer — Registration</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;color:#173d2b;margin:0;background:#f6f8f5}
main{max-width:650px;margin:28px auto;padding:30px;background:#fff;border:1px solid #e5ebe5;border-radius:12px}
h1{color:#236b45;line-height:1.15}
p{line-height:1.55}
.intro,.small{color:#5d6d63}
label{display:block;font-weight:bold;margin:18px 0 6px}
input{width:100%;padding:12px;border:1px solid #aab8ad;border-radius:6px;font:inherit}
.notice{margin-top:26px;padding:15px;background:#fff8e8;border-left:4px solid #d5a52c;color:#55451c;border-radius:4px}
.actions{margin:24px 0 4px}
button{background:#236b45;color:white;border:0;border-radius:8px;padding:12px 20px;font-weight:bold;font-size:1rem;cursor:pointer}
@media(max-width:700px){main{margin:12px;padding:22px}}
</style>
</head>
<body>
<main>
<h1>Free Pickup Soccer — Registration</h1>
<p class="intro">Sign up for free pickup soccer. Games are for players ages 11–14.</p>

<form action="https://formsubmit.co/salil.jani@gmail.com" method="POST">
<label for="player">Participant's Name *</label>
<input id="player" name="Participant's Name" type="text" required>

<label for="age">Participant's age *</label>
<input id="age" name="Participant's age" type="number" min="11" max="14" required>

<label for="email">Email *</label>
<input id="email" name="Email" type="email" required placeholder="name@example.com">

<label for="phone">Phone number (optional)</label>
<input id="phone" name="Phone number (optional)" type="tel">

<input type="hidden" name="_subject" value="New Free Pickup Soccer Registration">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" value="https://physicsguys.github.io/Free-Pickup-Soccer/thankyou.html">

<div class="notice">
<strong>Important:</strong> Your parent or guardian will have to sign a waiver before you come to play. We will email you once the next game is scheduled.
</div>

<div class="actions"><button type="submit">Register</button></div>
</form>
</main>
</body>
</html>
